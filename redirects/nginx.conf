# 301 redirect: bmbspace.id -> berkahmeetingbareg.id
# Add this as its own server block on whatever server currently hosts
# the OLD domain (bmbspace.id). Not part of the new site's deploy config.

server {
    listen 80;
    listen 443 ssl;
    server_name bmbspace.id www.bmbspace.id;

    # Keep the existing SSL certificate for bmbspace.id active until
    # the redirect has been live for a while, otherwise HTTPS requests
    # will fail before the redirect can fire.
    # ssl_certificate     /path/to/bmbspace.id/fullchain.pem;
    # ssl_certificate_key /path/to/bmbspace.id/privkey.pem;

    return 301 https://www.berkahmeetingbareg.id$request_uri;
}
